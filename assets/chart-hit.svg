<text x="712" y="176" font-size="16" font-weight="700" fill="#111827">53<tspan font-weight="400" fill="#6B7280"> / 57</tspan><tspan font-size="13" font-weight="400" fill="#6B7280">　93.0%</tspan></text>
<text x="32" y="230" font-size="15" font-weight="700" fill="#111827">上位5件に正解資料</text>
<text x="32" y="248" font-size="12" fill="#6B7280"></text>
