<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" width="880" height="336" role="img" aria-label="正解資料が1位は57問中43問。上位5件まで見れば57問すべて" font-family="'Segoe UI','Hiragino Sans','Yu Gothic UI','Meiryo','Noto Sans JP',sans-serif">
<rect x="0.5" y="0.5" width="879" height="335" rx="12" fill="#FFFFFF" stroke="#D1D5DB"/>
<text x="32" y="44" font-size="20" font-weight="700" fill="#111827">正解資料が1位は57問中43問。上位5件まで見れば57問すべて</text>
<text x="32" y="70" font-size="13.5" fill="#6B7280">EmbeddingGemma 2。14資料・63検索単位に対する、答えのある質問57問の検索結果</text>
<text x="32" y="114" font-size="15" font-weight="700" fill="#111827">1位が正解資料</text>
