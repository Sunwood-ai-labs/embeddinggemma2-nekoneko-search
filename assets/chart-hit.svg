<text x="712" y="118" font-size="16" font-weight="700" fill="#111827">43<tspan font-weight="400" fill="#6B7280"> / 57</tspan><tspan font-size="13" font-weight="400" fill="#6B7280">　75.4%</tspan></text>
<text x="32" y="172" font-size="15" font-weight="700" fill="#111827">上位3件に正解資料</text>
<text x="32" y="190" font-size="12" fill="#6B7280"></text>
<rect x="400" y="158" width="300" height="24" rx="4" fill="#EEF0F2"/>
