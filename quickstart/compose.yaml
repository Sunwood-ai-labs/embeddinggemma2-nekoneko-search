name: embeddinggemma2-quickstart
services:
  bench:
    build:
      context: .
      dockerfile: Containerfile
    cpus: 4
    mem_limit: 8g
    environment:
      MODEL_ID: google/embeddinggemma-2
      MODEL_REVISION: 914f7f89142e33e77833254d9c9b90c3cef7303b
      TORCH_THREADS: "4"
    volumes:
      - ./inputs:/work/inputs:ro
      - ./out:/work/out
      - model-cache:/cache
volumes:
  model-cache:
